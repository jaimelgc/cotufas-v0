services:
  db:
    image: postgres:16-alpine
    env_file: .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    # NOT exposed to host — only internal network

  backend:
    build:
      context: ./cotufas
      args:
        COLLECT_STATIC: "true"
    env_file: .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: cotufas.settings.prod
    volumes:
      - static_volume:/app/staticfiles
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build: ./frontend          # full multi-stage build
    restart: unless-stopped

  nginx:
    build: ./nginx
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/staticfiles  # shared with backend
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume: